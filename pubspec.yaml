name: flowva_school
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  equatable: ^2.0.8
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  cupertino_icons: ^1.0.9
  dio: ^5.1.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.0.1
  flutter_foreground_task: ^9.2.2
  easy_localization: ^3.0.8
  curved_navigation_bar: ^1.0.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Images/
    - assets/locales/



flutter_launcher_icons:
  android: "launch_background"
  ios: true
  image_path: "assets/Images/logo.png"
  min_sdk_android: 21
